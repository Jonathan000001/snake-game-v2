<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge"> 
    <link rel="stylesheet" href="src/style.css">
    <script defer src="src/script.js"></script>
    <title>Snake Game</title>
    
</head>
<body>
    <h1>SNAKE GAME!🐍️</h1>
    <h2>Score:<span id="score">0</span></h2>
    <canvas id="snake" width="512" height="512"></canvas>
    
    <div class="controls-container">
        <button id="btn-up" class="seta">⬆️</button>
        
        <div class="horizontal-controls">
            <button id="btn-left" class="seta">⬅️</button>
            <button id="btn-reset">Restart Game</button> 
            <button id="btn-right" class="seta">➡️</button>
        </div>
        
        <button id="btn-down" class="seta">⬇️</button>
    </div>

    <p class="instrucoes">Use as setas do teclado para mover e ENTER para reiniciar.</p>
</body>
</html>
